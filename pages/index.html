<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Duck Platformer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#181425" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Duck Platformer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/nav.css" />
    <script src="/nav.js" defer></script>
    <script src="/site.js" defer></script>
    <style>
      /* Colours from art's palette (public/art/palette.json). Art's fonts are BMFont files for
         the game, so the page uses the system font stack. */
      :root {
        --amber: #feae34;
        --cream: #ead4aa;
        --grey: #8b9bb4;
        --ink: #181425;
        --orange: #f77622;
        --yellow: #fee761;
        color-scheme: dark;
      }
      /* The duck beside the text, centred in the space below the nav bar; in portrait, above
         it. */
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px 32px;
        padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px
          max(16px, env(safe-area-inset-left, 0px));
        color: var(--cream);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 18px;
        line-height: 1.5;
      }
      @media (orientation: portrait) {
        main {
          flex-direction: column;
        }
      }
      .intro {
        display: grid;
        gap: 16px;
        justify-items: start;
        max-width: 40ch;
      }
      /* The duck's first frame, at twice its size. */
      .duck {
        display: block;
        width: 64px;
        height: 48px;
        object-fit: none;
        object-position: 0 0;
        image-rendering: pixelated;
        flex: none;
        zoom: 2;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 8vw, 48px);
        line-height: 1.1;
      }
      p {
        margin: 0;
      }
      .play {
        padding: 10px 28px;
        border-radius: 4px;
        background: var(--amber);
        box-shadow: 0 4px 0 var(--orange);
        color: var(--ink);
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
      }
      .play:hover {
        background: var(--yellow);
      }
      .play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--orange);
      }
      .note {
        color: var(--grey);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="duck" src="/art/sprites/duck.png" alt="" />
      <div class="intro">
        <h1>Duck Platformer</h1>
        <p>
          A duck falls out of her apartment at the top of a high-rise, flutters safely down to the
          bottom, and climbs back up through the building to get home.
        </p>
        <a class="play" href="/play/">Play</a>
        <p class="note">Plays in a landscape phone browser, or on a computer with a keyboard.</p>
      </div>
    </main>
    <div class="turn-sideways" role="alert">
      <svg class="turn-sideways-phone" viewBox="0 0 20 12" aria-hidden="true">
        <path d="M0 2v8h1v1h1v1h16v-1h1v-1h1V2h-1V1h-1V0H2v1H1v1z" />
        <path class="turn-sideways-screen" d="M3 2v8h12V2z" />
        <path class="turn-sideways-screen" d="M17 5v2h1V5z" />
      </svg>
      <p>Turn your phone sideways</p>
    </div>
  </body>
</html>
