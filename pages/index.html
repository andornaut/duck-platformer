<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Duck Platformer</title>
    <meta name="description" content="%HOME_DESCRIPTION%" />
    <link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#c0cbdc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Duck Platformer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/nav.css" />
    <script src="/nav.js" defer></script>
    <script type="module" src="/src/homePage/main.ts"></script>
    <style>
      /* Homepage colours and layout stay local to this document. */
      :root {
        --home-blue: #a8bfd4;
        --home-dslate: #3a4466;
        --home-grey: #8b9bb4;
        --home-ink: #181425;
        --home-lgrey: #c0cbdc;
        --home-white: #ffffff;
        --home-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color-scheme: light;
      }
      body.home {
        background: var(--home-lgrey);
        color: var(--home-ink);
        font: 16px/1.5 var(--home-font);
      }
      .home main {
        box-sizing: border-box;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 24px max(16px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      }
      .home-content {
        display: grid;
        grid-template-areas: "brand" "about" "actions" "keys";
        grid-template-columns: minmax(0, 440px);
        justify-content: center;
        justify-items: center;
        gap: 16px;
        width: 100%;
        max-width: 1040px;
        margin: auto;
        text-align: center;
      }
      .brand {
        grid-area: brand;
        position: relative;
        isolation: isolate;
        width: min(360px, 100%);
        aspect-ratio: 360 / 225;
      }
      .scenery,
      .scenery::before,
      .scenery::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scenery {
        overflow: hidden;
        background: var(--home-blue);
      }
      .scenery::before,
      .scenery::after {
        content: "";
        background-repeat: repeat-x;
        background-position: center bottom;
        background-size: 100% auto;
        image-rendering: pixelated;
      }
      .scenery::before {
        background-image: url("/art/backdrops/street-city-far.png");
        opacity: 0.4;
      }
      .scenery::after {
        background-image: url("/art/backdrops/street-city-mid.png");
        opacity: 0.3;
      }
      .hero {
        position: relative;
        margin: 0;
      }
      .logo {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
      }
      .about {
        grid-area: about;
        display: grid;
        gap: 12px;
        max-width: 440px;
      }
      .pitch,
      .sub {
        margin: 0;
        text-wrap: pretty;
      }
      .pitch {
        font-size: 20px;
        line-height: 1.4;
        text-wrap: balance;
      }
      .sub,
      .keys {
        color: var(--home-dslate);
      }
      .actions {
        grid-area: actions;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }
      .play,
      .install,
      .steps-close {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        min-width: 112px;
        padding: 12px 16px;
        border: 2px solid var(--home-dslate);
        color: var(--home-ink);
        background: var(--home-grey);
        font: 600 16px/1.25 var(--home-font);
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .play,
      .install {
        width: 144px;
      }
      .play {
        color: var(--home-white);
        background: var(--home-dslate);
      }
      .install[hidden] {
        display: none;
      }
      .play:hover,
      .play:active {
        background: var(--home-ink);
      }
      .install:hover,
      .steps-close:hover {
        background: var(--home-lgrey);
      }
      .play:focus-visible,
      .install:focus-visible,
      .steps-close:focus-visible {
        outline: 3px solid var(--home-ink);
        outline-offset: 3px;
      }
      .keys {
        grid-area: keys;
        display: grid;
        gap: 8px;
        max-width: 440px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
      }
      .steps {
        box-sizing: border-box;
        width: min(368px, calc(100vw - 32px));
        padding: 24px;
        border: 2px solid var(--home-dslate);
        color: var(--home-ink);
        background: var(--home-lgrey);
        font: 16px/1.5 var(--home-font);
      }
      .steps::backdrop {
        background: rgb(24 20 37 / 0.5);
      }
      .steps-body {
        display: grid;
        gap: 16px;
      }
      .steps h2 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.4;
        text-align: center;
      }
      .steps p {
        margin: 0;
      }
      .steps-close {
        justify-self: end;
      }
      @media (min-width: 700px) and (orientation: landscape) {
        .home-content {
          grid-template-areas: "brand about" "brand keys" "actions .";
          grid-template-columns: minmax(0, 360px) minmax(0, 440px);
          gap: 16px 32px;
          align-items: center;
          text-align: start;
        }
        .about,
        .actions,
        .keys {
          width: 100%;
          justify-self: start;
        }
        .about {
          align-self: end;
        }
        .keys {
          align-self: start;
        }
      }
      @media (min-height: 600px) and (min-width: 700px) {
        .home main {
          display: grid;
          align-items: center;
        }
      }
    </style>
  </head>
  <body class="home">
    <main>
      <div class="home-content">
        <div class="brand">
          <div class="scenery" aria-hidden="true"></div>
          <h1 class="hero">
            <img class="logo" src="/art/logo.png" width="360" height="193" alt="Duck Platformer" />
          </h1>
        </div>
        <div class="about">
          <p class="pitch">%HOME_DESCRIPTION%</p>
          <p class="sub">%HOME_SUBLINE%</p>
        </div>
        <div class="actions">
          <button class="install" id="install" type="button" hidden>%HOME_INSTALL%</button>
          <a class="play" href="/play/">%HOME_PLAY%</a>
        </div>
        <ul class="keys">
          <li>%HOME_TOUCH%</li>
          <li>%HOME_KEYBOARD%</li>
        </ul>
      </div>
    </main>

    <dialog class="steps" id="install-steps" aria-labelledby="install-steps-ios">
      <div class="steps-body">
        <div data-browser="firefoxAndroid" hidden>
          <h2 id="install-steps-firefoxAndroid">Add app to Home screen</h2>
          <p>Tap the menu, then More, then Add app to Home screen.</p>
        </div>
        <div data-browser="ios" hidden>
          <h2 id="install-steps-ios">Add to Home Screen</h2>
          <p>Tap Share, then Add to Home Screen.</p>
        </div>
        <button class="steps-close" type="button">Close</button>
      </div>
    </dialog>
  </body>
</html>
